server:
  port: 8080

spring:
  application:
    name: pixel-care-backend
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://pg-278ea08-dropcast.i.aivencloud.com:21886/defaultdb?sslmode=require&sslfactory=org.postgresql.ssl.NonValidatingFactory}
    username: ${SPRING_DATASOURCE_USERNAME:avnadmin}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      connection-timeout: 30000
      minimum-idle: 1
  flyway:
    enabled: false
    baseline-on-migrate: true
    out-of-order: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

upstage:
  api:
    key: ${UPSTAGE_API_KEY:}
    base-url: ${UPSTAGE_BASE_URL:https://api.upstage.ai/v1}
    model: ${UPSTAGE_MODEL:solar-pro3}

app:
  storage:
    path: ${APP_STORAGE_PATH:storage}
  bootstrap:
    enabled: ${APP_BOOTSTRAP_ENABLED:true}
    operator-password: ${APP_OPERATOR_PASSWORD:Operator123!}
    manager-password: ${APP_MANAGER_PASSWORD:Manager123!}
    donor-password: ${APP_DONOR_PASSWORD:Donor123!}

modusign:
  api:
    email: ${MODUSIGN_USER_EMAIL:}
    key: ${MODUSIGN_API_KEY:}
    base-url: ${MODUSIGN_BASE_URL:https://api.modusign.co.kr}
    template-id: ${MODUSIGN_TEMPLATE_ID:}
    participant-role: ${MODUSIGN_PARTICIPANT_ROLE:신청자}
    redirect-url: ${MODUSIGN_REDIRECT_URL:http://127.0.0.1:5173/my-page}
  webhook:
    secret: ${MODUSIGN_WEBHOOK_SECRET:}
