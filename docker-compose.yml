name: pixelcare

services:
  postgres:
    image: postgres:16-alpine
    container_name: pixelcare-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-pixelcare}"
      POSTGRES_USER: "${POSTGRES_USER:-pixelcare}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-pixelcare_local}"
      TZ: Asia/Seoul
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  postgres_data:
