name: pixelcare

services:
  mysql:
    image: mysql:8.4
    container_name: pixelcare-mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE:-pixelcare}"
      MYSQL_USER: "${MYSQL_USER:-pixelcare}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-pixelcare_local}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-pixelcare_root_local}"
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql_84_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  mysql_84_data:
