server:
  # Render는 PORT를 주입한다. 8080으로 고정하면 배포에서 포트를 못 잡는다.
  port: ${PORT:8080}

spring:
  application:
    name: pixel-care-backend
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://pg-278ea08-dropcast.i.aivencloud.com:21886/defaultdb?sslmode=require&sslfactory=org.postgresql.ssl.NonValidatingFactory}
    username: ${SPRING_DATASOURCE_USERNAME:avnadmin}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    # 배포는 PostgreSQL이고 로컬은 아직 MySQL이다.
    # 드라이버가 고정이면 로컬에서 주소만 바꿔도 뜨지 않으므로 덮을 수 있게 둔다.
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 30000
      minimum-idle: 1
  sql:
    init:
      mode: always
      continue-on-error: true
      # 이 값이 없으면 스프링은 schema-all.sql / schema.sql만 찾는다.
      # schema-postgresql.sql이 있어도 파일명이 안 맞아 그대로 무시되고,
      # JPA가 만드는 표만 생겨 user_roles 같은 표가 없다며 기동이 실패한다.
      # 로컬 MySQL에서는 SPRING_SQL_PLATFORM=mysql로 두면 해당 파일이 없어 아무것도 실행되지 않는다.
      platform: ${SPRING_SQL_PLATFORM:postgresql}
  flyway:
    enabled: false
    baseline-on-migrate: true
    out-of-order: true
    locations: classpath:db/migration
  jpa:
    database-platform: ${SPRING_JPA_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: ${SPRING_JPA_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
        temp:
          use_jdbc_metadata_defaults: false
        format_sql: true
        jdbc:
          time_zone: UTC

upstage:
  api:
    key: ${UPSTAGE_API_KEY:}
    base-url: ${UPSTAGE_BASE_URL:https://api.upstage.ai/v1}
    model: ${UPSTAGE_MODEL:solar-pro3}

app:
  cors:
    # 배포에서는 프론트 주소를 넣는다. 예) https://itda.vercel.app,https://*.vercel.app
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
  storage:
    path: ${APP_STORAGE_PATH:storage}
  bootstrap:
    enabled: ${APP_BOOTSTRAP_ENABLED:true}
    operator-password: ${APP_OPERATOR_PASSWORD:Operator123!}
    manager-password: ${APP_MANAGER_PASSWORD:Manager123!}
    donor-password: ${APP_DONOR_PASSWORD:Donor123!}

modusign:
  api:
    email: ${MODUSIGN_USER_EMAIL:}
    key: ${MODUSIGN_API_KEY:}
    base-url: ${MODUSIGN_BASE_URL:https://api.modusign.co.kr}
    template-id: ${MODUSIGN_TEMPLATE_ID:}
    participant-role: ${MODUSIGN_PARTICIPANT_ROLE:신청자}
    redirect-url: ${MODUSIGN_REDIRECT_URL:http://127.0.0.1:5173/my-page}
  webhook:
    secret: ${MODUSIGN_WEBHOOK_SECRET:}
