version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: pixelcare-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: pixelcare
      MYSQL_USER: pixel_user
      MYSQL_PASSWORD: pixel_password
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
