server:
  port: 8080

spring:
  application:
    name: pixel-care-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/pixelcare?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${SPRING_DATASOURCE_USERNAME:pixel_user}
    password: ${SPRING_DATASOURCE_PASSWORD:pixel_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

upstage:
  api:
    key: ${UPSTAGE_API_KEY:your_upstage_api_key_here}
    base-url: https://api.upstage.ai/v1/solar
